name: Testar scripts de instalacao

on:
  pull_request:
    paths:
      - 'mother.ps1'
      - 'mother.sh'
      - 'onpremise.sh'
      - 'tests/**'
      - '.github/workflows/testar-scripts.yml'
  push:
    branches: [main]
    paths:
      - 'mother.ps1'
      - 'mother.sh'
      - 'onpremise.sh'
      - 'tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Exercitar mother.sh e onpremise.sh
        run: bash tests/test-mother-sh.sh

      - name: Exercitar mother.ps1
        shell: bash
        run: bash tests/test-mother-ps1.sh
